
issuer: https://wac-hospital.loc:8081/dex  # URL, kde pobeží Dex ... pridal som port nakolko musim port-forwardovat, lebo k3d cluster nespristupnuje port ako ocakavame
storage:
  type: kubernetes
  config:
    inCluster: true
oauth2:
  skipApprovalScreen: true
web:
  http: 0.0.0.0:5556

connectors:  # GitHub OAuth provider
- type: github
  id: github
  name: GitHub
  config:
    clientID: $GITHUB_CLIENT_ID
    clientSecret: $GITHUB_CLIENT_SECRET
    redirectURI: https://wac-hospital.loc:8081/dex/callback  # ... pridal som port nakolko musim port-forwardovat, lebo k3d cluster nespristupnuje port ako ocakavame

staticClients:  # WAC hospital client of Dex ... pridal som port nakolko musim port-forwardovat, lebo k3d cluster nespristupnuje port ako ocakavame
- id: envoy-gateway
  redirectURIs:
  - 'https://wac-hospital.loc:8081/authn/callback'
  name: 'Envoy Gateway'
  secret: envoy-gateway-secret-265305158967

telemetry:
  tracing:
    enabled: false
