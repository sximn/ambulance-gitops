apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: patient-visit-fe
  namespace: wac-hospital
spec:
  imageRepositoryRef:
    name: patient-visit-fe # referuje ImageRepository z predchádzajúceho kroku
  filterTags:
    pattern: "main.*" # vyberie všetky verzie, ktoré začínajú na main- (napr. main-20240315.1200)
  policy:
    alphabetical:
      order: asc
